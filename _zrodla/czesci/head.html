<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{tytul}}</title>
  <meta name="description" content="{{opis}}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFF9F8">
  <meta name="color-scheme" content="light">

  <!-- Podgląd linku w WhatsAppie i Messengerze. Jeśli repo ma inną nazwę niż AkademiaMocy, popraw adres obrazka. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pl_PL">
  <meta property="og:title" content="{{og_tytul}}">
  <meta property="og:description" content="{{opis}}">
  <meta property="og:image" content="https://dominikszewczyk224180.github.io/AkademiaMocy/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/instrument-sans-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <script>
    /* Demo: drugi wariant krojów pod ?fonty=b. Wybór zapamiętuje przeglądarka. */
    (function () {
      var v = null;
      try { v = new URLSearchParams(location.search).get('fonty'); } catch (e) {}
      try {
        if (v) { localStorage.setItem('akademia-fonty', v.toLowerCase()); }
        else { v = localStorage.getItem('akademia-fonty'); }
      } catch (e) {}
      if (v && v.toLowerCase() === 'b') { document.documentElement.setAttribute('data-fonty', 'b'); }
    })();
  </script>
</head>
